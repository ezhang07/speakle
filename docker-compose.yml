services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: speakle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - speakle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speakle"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  whisper:
    build: ./whisper-service
  
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/speakle
      WHISPER_SERVICE_URL: http://whisper:8000
      DB_PASSWORD: ${DB_PASSWORD:-password}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
volumes:
  speakle-db:
