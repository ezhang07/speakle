<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The top-bar wordmark's four bars (see .wordmark-mark in Layout.css).
       Transparent ground, so the bars sit straight on the browser's tab strip
       and are scaled to fill the canvas rather than a tile. -->
  <g fill="#4fd1c5">
    <rect x="1.3"  y="9.88"  width="4.2" height="12.25" rx="2.1"/>
    <rect x="9.7"  y="2"     width="4.2" height="28"    rx="2.1"/>
    <rect x="18.1" y="7.25"  width="4.2" height="17.5"  rx="2.1"/>
    <rect x="26.5" y="11.63" width="4.2" height="8.75"  rx="2.1"/>
  </g>
</svg>
