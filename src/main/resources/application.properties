spring.application.name=speakle
spring.datasource.url=jdbc:postgresql://localhost:5432/speakle
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Path to the ffmpeg binary (override if it's not on PATH)
ffmpeg.path=ffmpeg

# Whisper transcription is now its own FastAPI service (whisper-service/).
# The backend POSTs the extracted mp3 to this URL over HTTP.
whisper.service.url=http://localhost:8000

# Video uploads are large; bump the multipart limits off the 1MB default
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Gemini API key
gemini.api.key=${GEMINI_API_KEY}

# JWT secret key for signing tokens 
jwt.secret=${JWT_SECRET}